[package]
name = "sysrewind"
version = "0.1.0"
edition = "2021"

[lib]
name = "sysrewind_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
sysinfo = "0.35"
# NVIDIA GPU temperature; loads the driver's NVML library at runtime (Windows and Linux).
nvml-wrapper = "0.10"

[target.'cfg(windows)'.dependencies]
wmi = "0.14"
libloading = "0.8"
png = "0.17"
base64 = "0.22"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
