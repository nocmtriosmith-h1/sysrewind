name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Fetch PawnIO installer (Windows bundle resource)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/fetch-pawnio.ps1

      - run: npm ci
      - run: npm run build

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Tests
        working-directory: src-tauri
        run: cargo test --lib --locked

      - name: Dependency audit
        if: runner.os == 'Linux'
        run: |
          npm audit --omit=dev
          cargo install cargo-audit --locked
          cd src-tauri && cargo audit
